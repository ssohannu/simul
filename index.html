<script>
(()=>{'use strict';

 let seed=357;const rnd=()=>{seed=seed*16807%2147483647;return (seed-1)/2147483646};const trees=$('trees');function tree(x,y,scale){let g=add(trees,'g',{transform:`translate(${x} ${y}) scale(${scale})`,opacity:'.97'});add(g,'polygon',{points:'-11,341 -26,113 -82,40 -71,28 -7,96 0,37 16,37 14,137 70,52 81,58 26,163 25,340',fill:'#dfe2e6'});add(g,'polygon',{points:'-11,341 -26,113 -7,102 4,338',fill:'#fbfbfc'});
 for(let [cx,cy,rr] of [[-92,35,78],[-26,2,91],[58,16,82],[103,64,67],[-127,98,60],[13,95,75]]){let pts=[];for(let j=0;j<8;j++){let rad=j*Math.PI/4-Math.PI/2,dist=rr*(.81+rnd()*.32);pts.push([cx+Math.cos(rad)*dist,cy+Math.sin(rad)*dist])}let fmt=ar=>ar.map(pt=>pt.map(v=>Math.round(v)).join(',')).join(' ');add(g,'polygon',{points:fmt(pts),fill:'#f9fafc'});for(let k=0;k<6;k++){let q=[cx+(rnd()-.5)*20,cy+(rnd()-.5)*30];add(g,'polygon',{points:fmt([pts[k],pts[(k+1)%8],q]),fill:['#e1e4e8','#e9eaee','#fff','#f2f3f6'][Math.floor(rnd()*4)],opacity:(.48+rnd()*.4).toFixed(2)})}}
 }
 tree(96,-120,1.18);tree(633,-87,.94);tree(1095,-120,1.18);tree(332,-128,.62);
 const wall=$('wall');add(wall,'polygon',{points:'0,505 1280,500 1280,607 0,584',fill:'#e8eaee'});for(let i=0;i<18;i++){let x=i*78-25,yy=509+(i%4)*5,bot=585+(i%3)*7;add(wall,'polygon',{points:`${x},${yy} ${x+46},${yy+2} ${x+31},${bot-36} ${x-10},${bot-33}`,fill:i%3===0?'#f8f9fb':'#e9ebee',opacity:'.83'});add(wall,'polygon',{points:`${x+46},${yy+2} ${x+89},${yy+4} ${x+73},${bot} ${x+31},${bot-36}`,fill:i%2?'#d9dde3':'#eff0f3',opacity:'.78'})}}
 function frame(t){let effect=0,type=0,turn=0;if(action){let p=clamp((t-action.start)/action.duration,0,1),ease=1-Math.pow(1-p,3);for(const x of ['c','a','r'])state.display[x]=lerp(state.before[x],state[x],ease);if(p>=1){action=null}else{type=action.type;effect=Math.pow(Math.sin(Math.PI*p),.92);turn=type===3?effect:0}}

 let l={x:822,y:468},rr={x:950,y:467},shL={x:835,y:351},shR={x:970,y:353};

 if(type===2){let clap=Math.sin((t-action.start)*.021),q=effect;l={x:lerp(l.x,876+14*clap,q),y:lerp(l.y,391,q)};rr={x:lerp(rr.x,889-14*clap,q),y:lerp(rr.y,391,q)}}
 if(type===3){l={x:lerp(l.x,793,turn),y:lerp(l.y,427,turn)};rr={x:lerp(rr.x,866,turn),y:lerp(rr.y,423,turn)};shL={x:835+22*turn,y:351+3*turn};shR={x:970-34*turn,y:353+8*turn}}
 let eL={x:lerp(798,shL.x+(l.x-shL.x)*.55,effect),y:lerp(418,shL.y+(l.y-shL.y)*.5+14,effect)};let eR={x:lerp(998,shR.x+(rr.x-shR.x)*.55,effect),y:lerp(416,shR.y+(rr.y-shR.y)*.5+13,effect)};
 poly('manUpperL',shL,eL,43,37);poly('manForeL',eL,l,37,27);poly('manUpperR',shR,eR,45,36);poly('manForeR',eR,rr,37,27);$('manHandL').setAttribute('transform',`translate(${l.x} ${l.y}) rotate(${-20*turn-27*(type===1?effect:0)})`);$('manHandR').setAttribute('transform',`translate(${rr.x} ${rr.y}) rotate(${-25*turn+24*(type===1?effect:0)})`);

 }
